<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommendation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1d2b22;
            --muted: #5d6b61;
            --paper: #f2f5ef;
            --card: #ffffff;
            --line: #d5ddd0;
            --leaf: #2d6a3e;
            --leaf-dark: #1c4a29;
            --wheat: #e2a93b;
            --error: #a8321f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "DM Sans", system-ui, sans-serif;
            color: var(--ink);
            background: var(--paper);
            line-height: 1.5;
        }

        .page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        h1 {
            font-family: "Young Serif", Georgia, serif;
            font-weight: 400;
            font-size: clamp(2rem, 5vw, 3.1rem);
            line-height: 1.1;
            margin: 0 0 12px;
            max-width: 14em;
        }

        .intro {
            color: var(--muted);
            max-width: 46ch;
            margin: 0 0 36px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 28px;
        }

        fieldset {
            border: 0;
            padding: 0;
            margin: 0 0 26px;
        }

        legend {
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0;
            margin-bottom: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
        }

        label {
            display: block;
            font-size: 0.92rem;
            font-weight: 500;
        }

        label small {
            display: block;
            color: var(--muted);
            font-weight: 400;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        input[type="number"] {
            width: 100%;
            margin-top: 6px;
            padding: 11px 12px;
            font: inherit;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        input[type="number"]:focus-visible,
        button:focus-visible {
            outline: 3px solid var(--wheat);
            outline-offset: 2px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        button {
            font: inherit;
            font-weight: 700;
            border-radius: 8px;
            padding: 13px 22px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .primary {
            background: var(--leaf);
            color: #fff;
        }
        .primary:hover { background: var(--leaf-dark); }
        .primary:disabled { opacity: 0.6; cursor: wait; }

        .secondary {
            background: transparent;
            color: var(--leaf-dark);
            border-color: var(--line);
        }
        .secondary:hover { background: var(--paper); }

        /* Result panel */
        .result {
            background: var(--leaf-dark);
            color: #f2f5ef;
            border-radius: 14px;
            padding: 32px 28px;
            min-height: 300px;
            position: sticky;
            top: 20px;
        }

        .result .hint {
            opacity: 0.8;
            margin: 0;
        }

        .result .label {
            margin: 0 0 4px;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .crop-name {
            font-family: "Young Serif", Georgia, serif;
            font-size: clamp(2.4rem, 7vw, 3.6rem);
            line-height: 1.05;
            margin: 0 0 6px;
            text-transform: capitalize;
            color: var(--wheat);
        }

        .confidence {
            margin: 0 0 26px;
        }

        .others-title {
            margin: 0 0 12px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 110px 1fr 48px;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.92rem;
        }

        .bar-row .name { text-transform: capitalize; }

        .bar-track {
            height: 10px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 99px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--wheat);
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        .bar-row .pct { text-align: right; }

        .error {
            background: #fbe9e5;
            color: var(--error);
            border-radius: 8px;
            padding: 12px 14px;
            margin: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .bar-fill { transition: none; }
        }
    </style>
</head>
<body>
<main class="page">
    <h1>What should you plant on this land?</h1>
    <p class="intro">Enter your soil test and local weather. The model compares them with 2,200 past records and suggests the crop that fits best.</p>

    <div class="layout">
        <form class="panel" id="crop-form" novalidate>
            <fieldset>
                <legend>Soil</legend>
                <div class="grid">
                    <label>Nitrogen (N)
                        <input type="number" id="N" step="any" min="0" placeholder="e.g. 90" required>
                        <small>Typical range 0–140</small>
                    </label>
                    <label>Phosphorus (P)
                        <input type="number" id="P" step="any" min="0" placeholder="e.g. 42" required>
                        <small>Typical range 5–145</small>
                    </label>
                    <label>Potassium (K)
                        <input type="number" id="K" step="any" min="0" placeholder="e.g. 43" required>
                        <small>Typical range 5–205</small>
                    </label>
                    <label>Soil pH
                        <input type="number" id="ph" step="any" min="0" max="14" placeholder="e.g. 6.5" required>
                        <small>Scale 0–14, typical 3.5–9.9</small>
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Weather</legend>
                <div class="grid">
                    <label>Temperature (°C)
                        <input type="number" id="temperature" step="any" placeholder="e.g. 21" required>
                        <small>Typical range 9–44</small>
                    </label>
                    <label>Humidity (%)
                        <input type="number" id="humidity" step="any" min="0" max="100" placeholder="e.g. 82" required>
                        <small>Range 0–100</small>
                    </label>
                    <label>Rainfall (mm)
                        <input type="number" id="rainfall" step="any" min="0" placeholder="e.g. 203" required>
                        <small>Typical range 20–300</small>
                    </label>
                </div>
            </fieldset>

            <div class="actions">
                <button type="submit" class="primary" id="submit-btn">Recommend a crop</button>
                <button type="button" class="secondary" id="example-btn">Fill in an example</button>
            </div>
        </form>

        <section class="result" id="result" aria-live="polite">
            <p class="hint">Your recommendation will show up here once you submit the form.</p>
        </section>
    </div>
</main>

<script>
    // If you open this file directly (double-click), talk to the local server.
    // If the page is served by FastAPI, the relative path works.
    const API_URL = location.protocol === "file:" ? "http://127.0.0.1:8000/predict" : "/predict";

    const FIELDS = ["N", "P", "K", "temperature", "humidity", "ph", "rainfall"];
    const form = document.getElementById("crop-form");
    const result = document.getElementById("result");
    const submitBtn = document.getElementById("submit-btn");

    document.getElementById("example-btn").addEventListener("click", () => {
        const example = { N: 90, P: 42, K: 43, temperature: 20.9, humidity: 82, ph: 6.5, rainfall: 202.9 };
        FIELDS.forEach(f => document.getElementById(f).value = example[f]);
    });

    function showError(message) {
        result.innerHTML = "";
        const p = document.createElement("p");
        p.className = "error";
        p.textContent = message;
        result.appendChild(p);
    }

    function showResult(data) {
        const others = data.top_3.slice(1).map(item => `
            <div class="bar-row">
                <span class="name">${item.crop}</span>
                <div class="bar-track"><div class="bar-fill" style="width:${(item.probability * 100).toFixed(1)}%"></div></div>
                <span class="pct">${(item.probability * 100).toFixed(0)}%</span>
            </div>`).join("");

        result.innerHTML = `
            <p class="label">Best match</p>
            <h2 class="crop-name">${data.recommended_crop}</h2>
            <p class="confidence">${(data.confidence * 100).toFixed(0)}% confidence</p>
            <p class="others-title">Other crops considered</p>
            ${others}`;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {};
        for (const f of FIELDS) {
            const value = document.getElementById(f).value;
            if (value === "") {
                showError("Please fill in every field before asking for a recommendation.");
                return;
            }
            payload[f] = parseFloat(value);
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Checking…";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(response.status === 422
                    ? "One of the values is out of range. Check pH (0–14) and humidity (0–100)."
                    : "The server returned an error. Try again.");
            }

            showResult(await response.json());
        } catch (err) {
            showError(err instanceof TypeError
                ? "Can't reach the API. Make sure the server is running with: uvicorn main:app --reload"
                : err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Recommend a crop";
        }
    });
</script>
</body>
</html>
